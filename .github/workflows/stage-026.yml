name: Stage v0.2.6 release
on:
  push:
    branches: [codex/release-v0.2.6-ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3771362e821827944914f298a025f43c9165485a
          path: source
          persist-credentials: false
      - name: Build matching firmware
        working-directory: source
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-ci build
          idf.py -B build-ci size
      - name: Collect firmware license files
        shell: bash
        run: python tools/cloud_release_026.py licenses
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-026-for-packaging
          if-no-files-found: error
          path: |
            source/build-ci/FoloToy-AI-Passport.bin
            source/build-ci/bootloader/bootloader.bin
            source/build-ci/partition_table/partition-table.bin
            source/build-ci/project_description.json
            source/build-ci/THIRD_PARTY_LICENSES/
  package:
    needs: firmware
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3771362e821827944914f298a025f43c9165485a
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: firmware-026-for-packaging
          path: source/build-ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r source/tools/requirements-build-exe.txt
      - name: Python tests on packaging runtime
        working-directory: source
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build and verify Windows packages
        run: python tools/cloud_release_026.py package
      - name: Upload verified assets to existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/cloud_release_026.py upload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-026-verification
          if-no-files-found: warn
          path: |
            cloud-output/release-verification.json
            cloud-output/SHA256SUMS.txt
